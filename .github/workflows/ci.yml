name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes whatever is still running for the same branch or PR —
# there is no point burning runners on a commit nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Compile check
        run: python -m compileall cli judges providers runners scoring
