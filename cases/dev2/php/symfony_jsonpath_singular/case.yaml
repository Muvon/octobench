instruction: |
  The JsonPath crawler lets invalid filter comparisons through. RFC 9535 (§2.3.5.2) says both operands of a comparison inside a filter selector must be SINGULAR queries — a leading `@` (or `$`) followed only by name selectors (`.name`, `['name']`, `["name"]`) and index selectors (`[0]`, `[-1]`); `@` alone is singular. But queries like `$[?(@..a == 1)]`, `$[?(@[*] == 1)]`, and `$[?(@.b.* == 1)]` currently return results instead of throwing — the existing check is a negative heuristic that only catches unions, slices, and the literal `@.*`, so descendant segments, bracket wildcards, and wildcards below the top level slip past. Worse, wrapping the filter in parentheses bypasses the check entirely: `$[?@..a==1]` throws but `$[?(@..a==1)]` returns results.

  Fix it so:
  - Every non-singular comparison operand is rejected with a JsonCrawlerException whose message contains "non-singular query is not comparable" — descendant segments (`@..a`), wildcards at any depth (`@[*]`, `@.*`, `@.b.*`, `@.b[*].a`), unions, slices, and nested filter selectors (`@[?@.a]`) all included.
  - Bare and parenthesised filter expressions are validated identically.
  - Non-singular queries remain legal as FUNCTION arguments (`count(@..a)`, `count(@[*])`) — functions accept nodelists; only comparison operands must be singular.
