system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Please make uncaught Wasm exceptions leaving a component trap with
  "uncaught exception propagated out of component", so they cannot be caught
  in another component or escape to the host as Wasm exceptions.
  Cover direct component exports and cross-component calls with every
  combination of synchronous and asynchronous lifts and lowers.
  The same applies to allocation exceptions during argument/result transfer,
  including `task.return` string results, host-supplied string arguments, and
  asynchronous stream string data; another component's catch-all must not
  intercept them.
  Exceptions escaping post-return functions, resource destructors, or
  asynchronous callbacks must also trap, on the initial call or after a yield.
  Keep locally caught exceptions working and preserve ordinary core-Wasm
  argument/result values, exception handling through tail calls, and existing
  exception propagation to the host.
