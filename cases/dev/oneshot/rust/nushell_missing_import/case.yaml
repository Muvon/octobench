system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  `stor import --file-name <path>` reports success when the path does not
  exist, creates an empty file, and silently replaces the current in-memory
  database with an empty one. Existing tables and rows are lost.

  A missing import source must instead return Nushell's file-not-found error,
  point the diagnostic at the supplied path, leave the in-memory database
  untouched, and avoid creating the missing file. Keep `stor export` behavior
  unchanged; creating its destination is valid.
