instruction: |
  **Goal.** As someone searching a large tree with a depth limit, I do not want ripgrep to be affected by ignore files sitting in directories it is never going to look inside.

  We hit this on a repository that has a generated, syntactically broken `.ignore` file deep in a build output directory. Searching with a depth limit that stops above it still reports an error about that file, and the walk spends time reading ignore files whose rules cannot apply to anything it will visit.

  **Acceptance criteria**

  - **Given** a directory at the configured maximum depth that contains a malformed ignore file, **when** the tree is walked, **then** the entry for that directory must carry no error, and the set of paths yielded must be exactly what it is without the malformed file present.
  - **Given** the same walk, **then** ignore files in directories the walk does descend into must keep taking effect exactly as before, at every depth up to the limit.
  - **Given** a directory that is skipped for any other reason, **then** its ignore files must likewise not influence the results, and the walk must still traverse and terminate normally.
  - **Given** no depth limit at all, **then** every ignore file in the tree is still read and applied, and malformed ones are still reported as errors.
