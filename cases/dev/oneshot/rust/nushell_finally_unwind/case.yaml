system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Please fix nested `try` cleanup so every intervening `finally` runs exactly
  once, innermost first, when leaving `try` or `catch`, including across
  custom-command calls and nested `try` expressions inside cleanup.
  After cleanup, propagate the pending error or complete `return`, `exit`,
  `break`, or `continue` without executing skipped statements; non-error
  transfers must bypass `catch`, preserving return values (including streams)
  and process exit codes.
  An error or control-flow transfer escaping cleanup supersedes the pending
  outcome, but an error handled entirely inside cleanup does not.
  Ordinary cleanup values must not replace a successful `try` result.
  A `finally` parameter receives the pending error record on an error path
  and `nothing` on a return path.
  Loop exits must preserve surrounding handlers and leave no exited cleanup
  handler that fires again on an unrelated error.
