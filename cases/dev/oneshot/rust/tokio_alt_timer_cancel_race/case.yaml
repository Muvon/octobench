instruction: |
  A `Sleep` that loses a `select!` or `timeout()` race can be cancelled before Tokio moves it into the alternate timer wheel, but it still gets inserted and keeps its allocation until the far-away deadline. Cancellation and insertion can happen concurrently: the timer must end up either never inserted or inserted and queued for removal, never stuck in the wheel with no way out.
