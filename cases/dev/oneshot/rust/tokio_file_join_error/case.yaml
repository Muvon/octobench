instruction: |
  We are seeing a flaky `JoinHandle polled after completion` panic when a Tokio
  runtime shuts down while `tokio::fs::File` I/O is in flight. If a backing
  blocking task is cancelled or cannot be spawned, the operation returns an
  error but leaves the file's internal state poisoned, so the next operation
  panics.

  Every affected file operation (`read`, `write`, `seek`, `flush`, and
  `set_len`) must leave the `File` in a valid reusable state when its blocking
  task fails. The operation should return an `io::Error`; subsequent operations
  may also error when the pool is unavailable, but must never panic. Preserve
  successful and pending-operation behavior.
