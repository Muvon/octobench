instruction: |
  We have a client on our network that terminates its last header line with a bare LF and then
  sends the blank line normally, so the end of the request head arrives as `...a: b\n\r\n`.

  Our server accepts that request when the whole head lands in one read. When the same bytes
  arrive split across reads it stalls instead: the connection sits waiting for more data even
  though a complete head is already buffered. Feeding the identical bytes to the full header
  parser shows it is perfectly happy with them, so the two disagree about when the head is over.

  It looks like the cheap check that runs on a partial read — the one deciding whether the buffer
  is worth handing to the parser yet — only understands the CRLF-CRLF and LF-LF endings, and does
  not accept an LF followed by CRLF.

  Please make that check agree with what the parser actually accepts:

  - a head whose final line ends with a bare LF and is followed by a CRLF blank line must be
    recognised as complete, at every split point the bytes could arrive in;
  - the endings that are already recognised must stay recognised;
  - genuinely incomplete input must still be reported incomplete — in particular a buffer ending
    in LF followed only by CR, with the terminating LF not yet received, must not be treated as a
    finished head;
  - the check must remain a scan of the buffered bytes, not become a second full parse.
