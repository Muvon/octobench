instruction: |
  If I parse a TOML datetime into a `toml::Value` and then call `.try_into::<toml::value::Datetime>()` on it, I get `invalid type: string "1979-05-27T07:32:00Z", expected a TOML datetime` instead of getting the datetime back. Can you make that conversion work? Converting the same value into a `serde_json::Value` should still produce a plain JSON string the way it does today.
