instruction: |
  When we decode a BMP-format .ico whose AND mask marks pixels as
  transparent, those pixels come out with alpha 0 but the original color
  values still sitting in the RGB channels. Downstream consumers that
  compare images or premultiply see stale color data leaking out of
  supposedly transparent pixels. A masked-out pixel should be fully
  transparent black — all four RGBA channels zero — not just alpha-cleared.
  Pixels the mask leaves opaque must be untouched.
