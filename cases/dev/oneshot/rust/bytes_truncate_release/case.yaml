instruction: |
  When a Bytes value is shared (cloned) and one holder is truncated down to zero length, it still keeps its reference to the underlying allocation — so the sibling clones can never obtain unique mutable access via `try_into_mut`, and pooled buffers are never reclaimed. Truncating to zero should release that clone's hold on the shared allocation: the truncated value ends up empty (keeping the pointer-address semantics the other zero-length operations use), sibling clones can then get `try_into_mut` to succeed and mutate the bytes, and `clear()` inherits the same behavior. Truncating to a non-zero length keeps today's behavior — the allocation stays shared and a sibling's `try_into_mut` still fails; `truncate(len >= self.len)` stays a no-op.
