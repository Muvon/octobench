system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  `cargo clean --doc` only removes `target/doc`. Documentation built for an
  explicit `--target` or a target configured through `[build] target` lives
  under `target/<triple>/doc` and is left behind.

  Make `cargo clean --doc` resolve the same requested/default compilation
  targets as `cargo doc` and remove the corresponding documentation
  directories. Support both an explicit `--target` and configured targets in
  the legacy and new build-directory layouts. Preserve the existing rejection
  of incompatible options such as `--doc` with `-p`.
