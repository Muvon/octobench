instruction: |
  Cranelift's alias-analysis pass can hit its
  `compute_block_input_states should have already found all observed stores`
  debug assertion during dead-store elimination.

  The failure is reproducible when a regionless store or an atomic store acts
  as a fence, followed by two stores to the same alias region and then another
  fence. The first regional store is eliminated, and processing the overwriting
  store then observes an instruction that the initial observation pass did not.

  Fix the alias-analysis state rollback so these inputs optimize without a
  panic, while preserving correct dead-store elimination and fence semantics
  for both ordinary regionless and atomic stores.
