instruction: |
  Current behavior

  Synchronously lifted and lowered calls with an async-typed intermediate
  function can execute incorrectly or fail with internal errors. A callee can
  start despite backpressure or another active call preventing entry, including
  calls that leave and re-enter an instance.

  Expected behavior

  An async-typed callee must obey its instance's backpressure and exclusive-entry
  rules even when both its lift and the caller's lower are synchronous. It must
  wait until both allow entry, while the synchronously lowered caller waits for
  its result. If another eligible task releases backpressure, the call must
  resume, execute only after that release, and return the callee's value unchanged.

  If backpressure is never released and no task can make progress, the trap
  should be "deadlock detected". The same applies when a callback holds
  exclusive entry while synchronously calling through an async-typed
  intermediary back into its own instance and cannot release that entry.
  If the intermediary is instead sync-typed and must block before returning,
  with no other eligible thread in its own instance, the trap should be
  "cannot block a synchronous task before returning".

  An async lowering to the async-typed intermediary should report a started
  but not yet returned subtask (status 1) while the callback holds exclusive
  entry. Once the callback yields by waiting on that subtask, deferred
  re-entry should proceed. The callback should receive EVENT_SUBTASK (1),
  STATUS_RETURNED (2), and the callee's unchanged result; the subtask handle
  and waitable set must remain usable for normal cleanup.
