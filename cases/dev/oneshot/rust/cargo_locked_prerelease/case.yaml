instruction: |
  Current behavior

  The initial prerelease support handles `cargo update --precise <prerelease>`,
  but later Cargo commands can discard or reject the pinned version in the
  lockfile.

  Expected behavior

  Introduce the nightly `-Zprerelease` flag, replacing `-Zunstable-options`
  gating for this capability. Subsequent commands must also receive
  `-Zprerelease` to use extended prerelease matching.

  With the flag, an explicitly selected compatible prerelease should remain
  locked during independent dependency updates, `check`, and `check --locked`,
  including registry transitive dependencies, dependencies of a path-patched
  package, and a package shared by direct and transitive requirements.
  A later explicit update to a compatible stable version should replace it normally.

  The flag must not select an unrequested prerelease or relax numeric version
  bounds: a requirement starting at `0.1.2` excludes `0.1.2-pre.0`, and an
  excluded upper bound stays excluded.

  Without the flag, ordinary resolution should remain unchanged: a locked
  prerelease that does not satisfy the ordinary requirement requires a lockfile
  update, an unlocked check may choose the compatible stable version, and
  incompatible shared direct/transitive requirements report their normal resolver
  conflict without rewriting the lockfile.

  Keep Cargo's existing update, download, check, and resolver diagnostic formats.
  A prohibited lockfile update must exit 101 with
  `cannot update the lock file <path> because --locked was passed to prevent this`
  and the help text
  `to generate the lock file without accessing the network, remove the --locked flag and use --offline instead.`
