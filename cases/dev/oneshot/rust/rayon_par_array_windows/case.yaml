instruction: |
  Rayon already has `par_windows` mirroring `slice::windows`, but there is no parallel equivalent of `slice::array_windows` (the const-generic version yielding `&[T; N]`). Add a `par_array_windows` method to ParallelSlice so users can iterate overlapping fixed-size windows in parallel, the same way they already can with `par_windows`.

  Requirements:
  - `par_array_windows::<N>()` takes the window length as a const generic parameter (no runtime size argument) and yields `&[T; N]` items.
  - It is an indexed parallel iterator: exact length, splittable, works with indexed consumers/collect like the existing `par_windows`.
  - The number of windows matches `slice::array_windows` semantics: `len().saturating_sub(N - 1)`, and N must be at least 1.
  - The public iterator type is named `ArrayWindows`, exported from the slice module alongside the existing `Windows` type, and implements Clone and Debug consistently with it.
  - No mutable variant is needed.

  Acceptance checks:
  - `[1, 2, 3].par_array_windows().collect::<Vec<_>>()` yields `[&[1, 2], &[2, 3]]`.
  - Parallel splits at every point produce exactly the same sequence as sequential `array_windows`.
