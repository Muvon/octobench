instruction: |
  Preview physical-space accounting makes `uv cache clean` and `uv cache
  prune` fail on filesystems that cannot report per-file physical extents (for
  example, when the required ioctl is unsupported). These filesystems were
  already supported by logical cache accounting.

  Make clean and prune fall back to logical byte accounting for the whole
  removal whenever physical accounting is unsupported, so the command still
  succeeds and reports the logical size. Distinguish an unsupported filesystem
  from an individual file whose physical size cannot be measured: the latter
  should retain the existing partial/incomplete physical-accounting behavior.
  Handle the platform-specific unsupported errors consistently and preserve
  saturating aggregation across combined removals.
