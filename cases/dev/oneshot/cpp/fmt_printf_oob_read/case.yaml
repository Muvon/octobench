instruction: |
  Printf-style formatting crashes on a malformed positional width or precision of index 0: running e.g. `fmt::sprintf("%*0$d", ...)` or `fmt::sprintf("%.*0$d", ...)` with plenty of arguments (say 16 ints) performs an out-of-bounds argument read and can die with SIGBUS in release builds. Positional argument indexes are 1-based, so index 0 is invalid and must surface the library's normal `format_error` with message "argument not found" — no crash and no out-of-bounds access, regardless of how many arguments are supplied.
