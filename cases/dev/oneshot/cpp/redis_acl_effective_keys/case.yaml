instruction: |
  We found ACL bypasses in commands whose effective keys depend on their arguments. Please make ACL checks cover the keys the command will actually use while preserving normal command parsing and execution.

  In particular, repeated `STORE`/`STOREDIST` options in `GEORADIUS` and `GEORADIUSBYMEMBER` use the last destination, so that final key must be checked. Repeated `STORE` in `SORT` behaves the same way, and an earlier destination may itself be named `BY`, `GET`, or `LIMIT` without confusing the option scan. For `XREAD` and `XREADGROUP`, validate the actual stream keys even when the group or consumer is named `STREAMS` or optional arguments appear before the real `STREAMS` marker. Keep source keys classified as reads and destination keys that are overwritten classified as writes.
