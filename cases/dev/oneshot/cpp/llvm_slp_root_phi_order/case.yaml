  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  LLVM's SLP vectorizer crashes on valid x86_64 code at `-O2`, `-O3`, and
  `-Os` with the assertion `PHI reordering is free.` The reduced IR contains
  an ordered horizontal reduction whose vectorization tree is rooted at a PHI,
  with operands coming from two control-flow paths.

  Fix the bottom-to-top reordering logic so an ordered reduction does not move
  an operand order onto a root PHI when that order must be preserved. The
  reproducer must continue to vectorize correctly; do not solve the crash by
  disabling SLP vectorization or ordered reductions.
