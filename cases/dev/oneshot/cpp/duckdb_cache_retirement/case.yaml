instruction: |
  Concurrent external-file-cache reads can fail with:

  `FileBufferHandleGroup::CopyTo: handles contain ... bytes but ... were requested`

  A cache block can be reclaimed while an existing reader still owns a handle.
  Retirement currently mutates that shared block's state and byte count, so the
  reader loses the immutable metadata it needs to finish copying. There is a
  second race where delayed retirement of an old range can erase replacement
  blocks that a newer reader has already installed.

  Make block retirement detach the selected old blocks from the cache index
  without invalidating handles held by existing readers. Future readers must
  obtain fresh blocks, and a stale or repeated retirement must remove only the
  exact old block instances it was asked to retire, never their replacements.
  Preserve synchronization and accounting invariants for normal cache reads.
