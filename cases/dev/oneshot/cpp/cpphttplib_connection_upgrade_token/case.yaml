instruction: |
  **Goal.** The WebSocket upgrade path must decide whether `Connection` carries the `upgrade`
  token by parsing the field as the comma-separated token list it is, rather than by searching
  the raw value for a substring.

  Today a request whose `Connection` value merely *contains* those letters is accepted as an
  upgrade request, and a legitimate request whose token list is spread over repeated `Connection`
  header lines can be rejected. Per RFC 9110 a comma-separated list field may carry several
  tokens and may be split across multiple lines of the same field.

  **Acceptance criteria**

  - **Given** a handshake whose `Connection` value contains `upgrade` only as part of a longer
    word — for example `notupgrade` or `upgraded` — **then** it must not be treated as carrying
    the `upgrade` token, and the handshake must be rejected.
  - **Given** a handshake whose `Connection` value is a token list such as `keep-alive, Upgrade`,
    with any casing and with optional whitespace around the commas, **then** the `upgrade` token
    must be recognised.
  - **Given** a handshake that sends `Connection` as several separate header lines, one of which
    carries the `upgrade` token, **then** the token must be recognised.
  - **Given** a handshake with no `Connection` header at all, or one whose token list does not
    contain `upgrade`, **then** it must be rejected.
  - The same token rules must apply on both sides: the server deciding whether an incoming request
    is a WebSocket upgrade, and the client verifying the server's upgrade response.
  - All other handshake requirements — the `Upgrade` field value, the `Sec-WebSocket-Key`
    validation, and existing non-WebSocket request handling — must be unchanged.
