instruction: |
  Resolve the following reported issue.

  # YAML octal scalars not converted to ints

  The [1.2.2 YAML spec](https://yaml.org/spec/1.2.2/#tags) indicates octal literals should be formatted as "0o123" which is annoyingly not consistent with what C++ thinks octal strings should look like (0123). 
  The stringstream extraction currently used expects octals to have a single leading '0', not '0o'. This is used by yaml-cpp:
  https://github.com/jbeder/yaml-cpp/blob/eaf72053724814be3b99d38e292fca5797a57b7b/include/yaml-cpp/node/convert.h#L142-L155
  Which ultimately means "0o123" cannot be converted to an int. "0123" on the other hand _can_ be converted to an int, which is maybe not the desired behavior if strictly adhering to the 1.2 spec.
  Note this is true only as of YAML 1.2, version 1.1 specifies octals the opposite way 🙃.
  Somewhat related to treatment of booleans:  #1198 

  Maintainer note: existing conversions, including legacy leading-zero octal (e.g. "0123"), must keep working.
