instruction: |
  Splitting a Parquet scan can change its inferred schema: a group starting
  with an INTEGER file can turn a later DOUBLE value of 1.4 into 1 before
  an outer cast sees it.

  D1. Add an opt-in `bound_schema` argument to `read_parquet` and
  `parquet_scan`: a non-NULL STRUCT whose keys are the original reader column
  names, in the requested output order, and whose values are non-NULL VARCHAR
  type declarations; this complete declared schema governs output independently
  of file order.

  D2. Values used by projection, filters, and joins must have the declared
  types, including widening and narrowing conversions; a split scan must agree
  with an equivalent unsplit scan, and existing `schema=` default/rename
  behavior and calls without `bound_schema` must retain their semantics.

  D3. Resolve nested fields by their names and preserve container, element, and
  parent NULL distinctions; missing nested children become NULL, while a
  missing physical root fails only when demanded, including by `count(root)`,
  and its diagnostic names that root.

  D4. Preserve native child-projection behavior: with optimization enabled,
  selecting a valid child must succeed despite an unused sibling's invalid
  conversion; reading the whole STRUCT, or disabling that projection
  optimization, must report `Could not convert` for the invalid conversion;
  disjoint STRUCT casts inside LIST/MAP values retain
  `STRUCT to STRUCT cast must have at least one matching member`.

  D5. Materialized filename, file-row-number, and Hive columns occupy their
  declared positions and retain their generated roles despite case-insensitive
  physical name shadows, custom filename names, file reordering, filters, and
  prepared-statement reuse; filename has type VARCHAR, file-row-number has type
  BIGINT, and Hive types must be explicit and agree with the declaration.

  D6. Declaration validation must be independent of option order, require
  explicit `hive_partitioning`, reject conflicting generated/Hive roles before
  file access or unsupported empty-input handling, and reject combination with
  `schema=`, `union_by_name=true`, or `allow_empty=true`. When `schema` is also
  supplied, report that incompatibility even if `hive_partitioning` is omitted.

  D7. Physical statistics and expression shortcuts must not change results
  when declared types, column positions, nested fields, or generated roles
  differ; caller-supplied `column_statistics` describe the declared target
  domain.

  D8. Preserve the explicit declaration and its types through `EXPLAIN (SQL)`
  reconstruction, logical-plan serialization, repeated prepared execution,
  empty physical files, and scans whose files are all pruned.

  D9. Keep these diagnostic fragments for the corresponding declaration
  errors:

  - Non-STRUCT/NULL declaration: `expects a non-NULL STRUCT`.
  - NULL/non-string type value: `types must be non-NULL VARCHAR`.
  - Missing explicit Hive setting: `requires explicit hive_partitioning`.
  - Missing Hive type declarations:
    `requires hive_types for every Hive partition column`.
  - Missing required role column: `must include column "<name>"`.
  - Wrong role-column type: `must include column "<name>" with type <TYPE>`.
  - Generated/Hive role collision: `cannot assign generated and Hive roles`.
  - Unsupported combinations: `does not support union_by_name`,
    `does not support allow_empty`, and `cannot be combined with 'schema'`.
  - Invalid `ANY` type:
    `Value "ANY" can not be converted to a DuckDB Type.`

  D10. Keep existing C++ constructors and functions source-compatible: their
  current callers, including the unit tests under `test/`, must build
  unchanged.
