instruction: |
  Extend fmt's `std::exception` and `std::exception_ptr` formatters to support
  the standard fill, alignment, and width specifiers. Left, right, and center
  alignment, custom fill, and dynamic width must work; a width smaller than the
  rendered message leaves it unchanged.

  Width and alignment must compose with the existing `t` presentation that
  includes the exception type. Apply the same formatting to null
  `exception_ptr` (`none`), non-null exception pointers, and the existing
  unknown-exception fallback. Preserve current default formatting, nested
  exception traversal, and compile-time format validation.
