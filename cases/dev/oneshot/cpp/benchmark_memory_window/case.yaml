instruction: |
  A registered `MemoryManager` currently measures allocations made by benchmark
  fixture `Setup()` and `Teardown()` callbacks, even though those callbacks are
  already outside the timed benchmark region. This makes exact allocation
  counts describe framework/fixture work rather than the benchmark body.

  Align the memory measurement window with the timed execution window:
  `MemoryManager::Start()` and `Stop()` should bracket only the benchmarked
  `RunInThread()` work, with setup before the window and teardown after it.
  Preserve repetition, reporter, thread-manager, and error-handling behavior.
