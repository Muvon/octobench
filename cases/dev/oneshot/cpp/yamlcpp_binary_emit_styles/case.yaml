instruction: |
  When emitting a YAML::Binary value, the emitter always produces the double-quoted base64 form (`!!binary "..."`) no matter which string-style manipulator is active. Regular strings already honor Auto, SingleQuoted, DoubleQuoted, and Literal — binary values should do the same, treating the base64 payload as the string whose style is chosen. The existing default output must not change.

  Requirements:
  - SingleQuoted emits a single-quoted scalar: `!!binary 'SGVsbG8sIFdvcmxkIQ=='`.
  - Literal in block context emits a literal block scalar: `!!binary |-` with the base64 on the next line, indented by the current indent plus the configured indent — so the Indent manipulator is respected (e.g. Indent(8) yields deeper indentation).
  - Literal in flow context falls back to the double-quoted form (literal scalars are not valid in flow).
  - Auto and DoubleQuoted keep emitting the double-quoted form exactly as before; an empty binary under Auto stays `!!binary ""`.
  - An empty binary under Literal emits `!!binary |-` followed by an empty content line (a truly empty line — no indentation whitespace).
