instruction: |
  Mixed signed/unsigned JSON number comparisons become mathematically wrong
  when the unsigned value is above `INT64_MAX`. For example, `json(-1) <
  json(UINT64_MAX)` returns false and `json(UINT64_MAX) == json(-1)` can return
  true because the unsigned operand is narrowed into the signed range.

  Correct all equality and ordering operators in both operand directions.
  Negative signed values must compare below every unsigned value; non-negative
  signed values should compare in the unsigned domain without overflow. Keep
  comparisons within the same numeric representation unchanged, and make the
  C++20 three-way comparison agree with the relational operators.
