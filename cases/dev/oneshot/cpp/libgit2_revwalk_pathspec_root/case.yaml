instruction: |
  We use libgit2 to build a "file history" view in our internal review tool. For each path we create a revwalk, attach a pathspec containing that one path, push HEAD, and list the commits that come back.

  On a small test repository, `git log -- README` from the command line lists two commits, but our walk only yields one. The commit that goes missing is always the repository's very first commit — the one with no parents. The same thing happens with a glob pathspec such as `*.txt`: we get every matching commit except the root one. If a path is not present in the root commit at all, the root commit is correctly absent, so the filter is not simply ignoring everything.

  A revwalk restricted by a pathspec should return exactly the commits `git log -- <path>` returns, in the same order, including root commits, and it should then finish normally with the usual "iteration over" status. Please fix the walk so the root commit is included whenever it actually contains a path matching the pathspec, for both literal paths and glob patterns.
