instruction: |
  We have an SSR page that can stay blank forever if an ordinary effect update changes content before hydration finishes while that content is hidden. I can reproduce it both when an `<Activity>` is hidden and when a parent `<Suspense>` boundary switches to its fallback: the promise resolves, React renders, but the update never commits. Make these updates recover normally; the same flows wrapped in `startTransition` must keep working.
