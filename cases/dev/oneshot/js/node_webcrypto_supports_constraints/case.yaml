instruction: |
  `SubtleCrypto.supports()` reports `true` for parameter combinations that the
  corresponding WebCrypto operations cannot accept. Align its answers and the
  shared validation paths with the current WebCrypto specifications:

  - Context parameters are at most 255 bytes. Backends that do not support a
    non-empty context must still reject it, while a 256-byte context is always
    unsupported.
  - HKDF output is limited to 255 digest blocks, based on the selected digest.
  - RSA key generation requires a modulus of at least 512 bits (2048 in FIPS
    mode) and an unsigned 32-bit public exponent that is odd and at least 3.
  - ML-KEM variants produce a 256-bit shared secret. `encapsulateKey` and
    `decapsulateKey` support only raw-secret target algorithms that can import
    that length: AES accepts its standard key sizes, ChaCha20-Poly1305 requires
    256 bits, and an explicit HMAC/KMAC bit length is compatible when its
    whole-byte storage length is 256 bits (so 249 through 256 bits are accepted,
    while 248 and 257 are not). Raw-secret KDF targets remain valid. Unrelated
    key algorithms must return `false`.

  Keep `supports()` non-throwing for unsupported combinations and preserve its
  existing prototype-safety behavior.
