instruction: |
  Our APM agent overrides `Error.prepareStackTrace` to return call-site objects instead of a string, and now every failed axios request rejects with `TypeError: dummy.stack.indexOf is not a function` instead of the real error (the ECONNREFUSED, the 401, whatever actually happened). That cosmetic stack-decoration step when a request fails should never be able to replace the actual request error, no matter what a stack-trace hook does — can you make it bulletproof?
