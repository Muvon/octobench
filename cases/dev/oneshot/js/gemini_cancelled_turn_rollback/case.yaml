system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Cancelling a prompt after it has made tool calls leaves the completed first
  turn and function responses in `GeminiChat` history. The next unrelated user
  message then resumes the cancelled task instead of starting cleanly.

  Treat every stream carrying the same prompt id as one request transaction.
  When an abort or cancellation happens in any continuation stream, roll back
  the entire request: restore chat history and token accounting to the state
  from before the original user prompt, not merely to the state before the
  latest function response. Completed requests and non-cancellation API error
  handling must retain their existing behavior.
