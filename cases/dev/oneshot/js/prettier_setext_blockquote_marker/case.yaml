instruction: |
  Formatting a Markdown file mangles a setext heading when the heading text spans more than one
  line inside a blockquote.

  Input:

  ```md
  > Multi
  > Line
  > ===
  ```

  Formatted output:

  ```md
  > Multi > Line
  > ===
  ```

  The `>` that introduces the second line of the heading is being kept as literal heading text and
  the two lines are joined, so the rendered heading reads `Multi > Line`. Reformatting is therefore
  not idempotent and the document changes meaning.

  A multi-line *paragraph* in a blockquote is handled correctly, so the blockquote markers are
  clearly being stripped for paragraphs but not for headings.

  Expected: the heading above formats back to itself. This should hold for both setext underlines
  (`===` and `---`), for headings spanning more than two lines, and inside nested blockquotes such
  as `> > Multi`. Formatting of blockquoted paragraphs, ATX headings and single-line setext
  headings must be unchanged.
