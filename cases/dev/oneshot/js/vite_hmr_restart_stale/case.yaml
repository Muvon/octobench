instruction: |
  **Goal.** As a developer running the dev server, I need an in-flight hot update to be abandoned cleanly when the server restarts underneath it, so that editing a file at the same moment a config or `.env` change triggers a restart does not take the dev server down.

  Right now, if a plugin's hot-update hook awaits and the server restarts during that await, the update keeps running against the environments that existed before the restart. It then crashes with a `TypeError` about setting a property of `undefined` while it is trying to report the original error.

  **Acceptance criteria**

  - **Given** a dev server whose plugin restarts the server from inside its hot-update hook and then throws, **when** a file update is processed, **then** handling that update must settle normally — no rejection and no crash escaping to the caller.
  - **Given** the same restart-mid-update situation, **when** the server is configured with a custom handler for dispatching hot updates to environments, **then** that handler must not be invoked at all for the stale update.
  - **Given** an ordinary file update with no restart, **then** hot-update plugin hooks, module filtering and the resulting update dispatch must behave exactly as before.
  - **Given** an update whose plugin hook throws without any restart, **then** the error must still be recorded and surfaced the way it is today.

  Do not fix this by suppressing errors generally, and do not change the public shape of the hot-update hooks.
