instruction: |
  Registry configuration can now live in both `package.json` and
  `components.json`, but the current resolution and write paths still treat
  them as mutually exclusive.

  Update registry handling with these rules:

  - When `components.json` exists, resolve the union of built-in registries,
    `package.json` registries, and `components.json` registries. Precedence per
    key is built-in, then package, then components (most specific wins).
  - A present but registry-free `components.json` must not hide registries from
    `package.json`. Invalid registry data in either present file must still
    report that file as the configuration error.
  - When no `components.json` exists, preserve the package-only behavior and do
    not inject built-ins.
  - `registry add` writes to `components.json` when it exists, otherwise to
    `package.json`; it preserves unrelated fields and existing registries,
    does not overwrite an already configured namespace, and errors clearly if
    neither file exists.
