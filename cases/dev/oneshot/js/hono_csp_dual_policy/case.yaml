instruction: |
  We turn on the secure-headers middleware with both a normal Content Security Policy and a report-only policy, because we are trialling a stricter policy before enforcing it. As soon as either of the two policies uses a nonce, every request to the app returns a 500 instead of our page.

  Roughly what we configure:

  ```ts
  app.use('/*', secureHeaders({
    contentSecurityPolicy: { defaultSrc: ["'self'"] },
    contentSecurityPolicyReportOnly: { scriptSrc: ["'self'", NONCE] },
  }))
  ```

  With only one of the two policies configured, nonces work fine. It also breaks the other way round — a nonce in the enforced policy plus a plain report-only policy fails the same way.

  What we expect: each of the two CSP response headers should carry only its own directives, whether it is static or built with a nonce, and configuring both at once should never fail the request. When both policies use a nonce, they should both get the nonce generated for that request.
