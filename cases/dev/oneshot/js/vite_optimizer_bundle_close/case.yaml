instruction: |
  Vite leaks the temporary Rolldown bundle used to analyze exports for
  dependencies matched by `optimizeDeps.extensions`. An optimizer plugin sees
  two bundle starts but only one close, and native resources remain alive.

  Ensure every temporary analysis bundle is closed after generation, including
  when generation or output parsing throws. Do not change the normal dependency
  prebundle lifecycle or the analyzed exports.
