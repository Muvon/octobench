instruction: |
  Add a public `@SseSignal()` route-parameter decorator that injects the
  `AbortSignal` for the current Nest SSE response. The signal must exist before
  an async `@Sse()` handler starts, work with both Express and Fastify request
  wrappers, and represent the full response lifetime: abort it when the client
  disconnects, when the Observable completes, or when it errors.

  If the client disconnects while an async handler or interceptor is still
  awaiting the producer Observable, do not subscribe that producer after it
  eventually resolves. This avoids starting side effects solely to tear them
  down. Setup-phase resources can instead observe the injected signal and clean
  themselves up. Remove close listeners on all terminal paths, keep abort and
  cleanup idempotent, and export the decorator through the normal public HTTP
  decorator surface without changing regular non-SSE routes.
