instruction: |
  When webpack's lazy-compilation backend shuts down after clients disconnect, the Node process can sit around for two minutes and the backend keeps stale module entries. Please fix the lifecycle so a module remains active until its last client disconnects, then is removed after the idle delay rather than retained or counted below zero. Disconnect timers must not keep Node alive. Disposing the backend must clear pending timers, and socket close events that arrive during disposal must not schedule new ones.
