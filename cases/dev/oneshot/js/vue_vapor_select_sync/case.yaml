instruction: |
  Vapor selects can lose selection when options render or update despite an unchanged
  selected value. Component-provided options, hydration, and removal during queued
  updates also behave inconsistently with VDOM.

  S1. Match equivalent VDOM select behavior on mount and updates: bound values must
  take effect after option values are ready, including keyed or reused options,
  slot-provided options, and options supplied by child components. Preserve VDOM's
  distinction between an owner update and a child-only option change: a plain value
  binding must not force a new selection on a child-only change when VDOM leaves the
  browser's selection intact. An unchanged v-model must be reapplied when its child
  component's options update.

  S2. Support ordinary and property-forced value bindings, object v-bind, dynamic
  keys, and bindings introduced, removed, set to null, or restored during an update.
  Preserve VDOM's constant-binding semantics: a standalone literal value initializes
  once, whereas a constant value participating in dynamic props is reapplied when
  appropriate. Evaluate each bound value expression exactly once during
  initialization, and do not reevaluate an unchanged value expression solely because
  its options changed.

  S3. A select's v-model takes precedence over a competing value binding both
  initially and after updates, including selects introduced conditionally. When owner
  and child inputs update together, settle selection before updated hooks and read the
  model only once for that update.

  S4. Initialize multiple before selected option bindings take effect. Unrelated
  updates must preserve a user's additional selection in a multiple select, including
  when its bound value is a number, string, or string-convertible object. Function
  directives and function refs must observe the initialized selection, including
  selects inside keyed rows.

  S5. Stop pending selection work when its select is removed: do not read the removed
  model or later change the detached select's value. This includes removal while a
  VDOM host updates and a newly created select whose host is removed in the same
  flush. A subsequently recreated select must initialize normally.

  S6. Preserve selection after hydration and later option changes. A property-forced
  value must win over an ordinary value after hydrated option values are ready.
  Preserve the existing warning containing "Hydration attribute mismatch" when the
  server's option attributes differ from the client bindings.

  S7. These behaviors must also hold when a Vapor select is rendered in a Vapor slot
  inside a VDOM host and its options come from VDOM components.
