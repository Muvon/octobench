instruction: |
  Our rate limiter can be bypassed by changing `X-Forwarded-For`, because it trusts that client-supplied header by default. Make the safe default use the actual connection's `REMOTE_ADDR`: forwarded headers and a fake HTTP `Remote-Addr` header must not change the identity unless the app explicitly opts into a proxy header. When `ipHeader: x-forwarded-for` is configured, keep supporting proxy chains and use the left-most client address, so the same client stays rate-limited even if later proxy hops change.
