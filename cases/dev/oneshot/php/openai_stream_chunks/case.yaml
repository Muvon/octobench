instruction: |
  `StreamResponse` reads SSE bodies one byte at a time. A large Responses API
  event such as compaction `encrypted_content` can cause millions of stream
  reads and retain avoidable copies of the raw JSON.

  Replace byte-at-a-time processing with a 64 KiB buffered reader while
  preserving SSE line and event boundaries across arbitrary underlying read
  sizes. Multiple events returned in one read must be yielded separately and
  unchanged, including large encrypted content. A temporary empty read before
  EOF is not end-of-stream: retry it without dropping the buffered partial
  line. Release large raw payload references before yielding parsed response
  objects and keep `[DONE]`, blank-line, and malformed-event behavior
  compatible.
