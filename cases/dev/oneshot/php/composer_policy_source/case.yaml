system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Composer tells us that a package was blocked by a dependency security policy, but not which policy source reported it, so we cannot configure `ignore-source` safely. When a filter entry has a source, include it in both user-facing places: append `Source: <name>.` to the plain audit finding, and describe a blocked locked package as `reported by <name>` in dependency-resolution errors. Entries without a source must keep the existing output unchanged.
