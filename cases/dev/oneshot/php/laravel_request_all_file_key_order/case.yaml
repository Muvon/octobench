  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  We hit a confusing bug submitting a repeatable form that mixes plain fields with file uploads.

  The form posts an `items` array where each row has a `name`, and only *some* rows carry a
  `photo` upload. So the request has input `items = [0 => ['name' => 'first'], 1 => ['name' => 'second']]`
  and files `items = [1 => ['photo' => <upload>]]`.

  When we read `$request->all()`, the `items` array comes back with its keys in the wrong order —
  the row that carried the upload is moved to the front, so `array_keys($request->all()['items'])`
  is no longer `[0, 1]`. Our downstream code iterates that array positionally and silently pairs
  row data with the wrong record.

  Reading the plain input on its own is fine, so it looks like the merge of uploaded files into the
  input is what disturbs the ordering.

  What we need from `all()`:

  - the resulting array must keep the ordering established by the request input, with file entries
    merged into their existing positions rather than promoted ahead of input keys;
  - nested file entries must still be merged in, so a row that carries an upload exposes both its
    input values and its uploaded file;
  - where an input key and a file key collide, the existing precedence must not change;
  - passing an explicit list of keys to `all()` must keep working as before.
