instruction: |
  Resolve the following reported issue.

  # Code blocks sometimes don't render first character

  ### Version(s) affected

  2.3, 2.4

  ### Description

  Hey there
  We switched our markdown interpreter to commonmark. While reviewing old texts with the new markdown interpreter I noticed a strange behavior. In a special scenario with code blocks, tabs and lists, the resulting markdown 'forgets' the first character of a given code block.
  I can reproduce it in a commonmark only project and will give you the code example below.

  ### How to reproduce

  I had a clean folder and only run `composer require league/commonmark`.
  I created a index.php and filled it with following code:
  ~~~
  <?php

  require __DIR__ . '/vendor/autoload.php';

  use League\CommonMark\CommonMarkConverter;

  $converter = new CommonMarkConverter();

  $str = <<<EOD
  # Stuff

  - Something more:
  	```
  	What's happening?
  	```
  EOD;

  echo $converter->convert($str);
  ~~~
  I ran `php -S localhost:8000 -t .`

  The resulting output is:
  (screenshot: the rendered code block is missing the first character of each line)

  ### Maintainer clarification

  Treat indentation by visual columns using four-column tab stops, rather than
  treating every tab as a fixed number of bytes or characters. The accepted fix
  must satisfy all of these behaviors:

  - Tab-indented opening and closing fences and their content inside list items
    must not lose the first character.
  - A fenced block's info string must remain intact.
  - Tabs beyond the structural indentation must remain literal tabs in the code
    block's content.
  - If indentation consumes only part of a tab, preserve the tab's remaining
    visual width as spaces up to the next four-column tab stop. For example, after
    one leading space, the remaining width of that tab is three spaces.
  - Preserve the existing behavior of ordinary space-indented fenced blocks.
