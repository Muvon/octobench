instruction: |
  Schema comparison never converges for `float` and `smallfloat` columns with
  defaults. Databases introspect a default such as `50` as a string while the
  desired schema holds `50.0` as a PHP float, so migrations repeatedly emit the
  same ALTER (or rebuild a SQLite table) even after it has been applied.

  Compare mapped float defaults by their PHP numeric value, as DBAL already
  does for mapped integers. Equivalent string/float representations must
  produce an empty diff in both comparison directions, while a genuinely
  different default must still produce a schema diff. Apply the behavior to
  both float mapping types without weakening comparison of other column
  properties.
