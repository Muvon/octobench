instruction: |
  When Monolog normalizes an exception it writes out every frame of the stack
  trace. On deep call stacks that buries the useful part of the log line and
  bloats whatever storage the records end up in. Make the number of trace frames
  configurable on `NormalizerFormatter`, alongside the existing normalization
  limits.

  Requirements:
  - The option is nullable: `getMaxTraceLength(): ?int` returns `null` by default,
    and `setMaxTraceLength(?int $maxTraceLength): self` accepts `null` to restore
    unlimited output and returns the formatter instance.
  - A non-null `maxTraceLength` limits how many stack frames a normalized
    exception includes. Existing output is unchanged while the option is `null`.
  - Setting it to `0` omits the normalized exception's `trace` field entirely.
  - The limit applies to every exception in the chain, so a previous exception's
    trace is capped the same way.
  - It composes with the existing base-path stripping: frames that survive the
    limit are still rendered exactly as they are today.
