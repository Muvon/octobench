instruction: |
  A limited parent query using a `hasMany` association's `subquery` loading
  strategy can generate invalid PostgreSQL when it orders by a column other
  than the binding key. The filtering subquery keeps the `ORDER BY`, reduces
  its select list to the binding key, and groups only by that key, so PostgreSQL
  rejects the ordered column as neither grouped nor aggregated.

  Make the filtering subquery group by the columns it actually orders on when
  the limit causes that ordering to be retained. Cover keyed `orderBy()` parts,
  `orderByAsc()`/`orderByDesc()` expression parts, and qualified columns from
  joined tables. Do not add aggregate expressions, constant select values, or
  opaque raw SQL fragments to `GROUP BY`, and do not add dead grouping columns
  when the subquery drops ordering because there is no limit. Preserve the
  existing HAVING aggregate handling and result-window semantics.
