instruction: |
  On PHP 8.2+, reading a period's `->end` property after calling `setEndDate()` still returns the end date from when the period was created (or null) instead of the newly set one, while `getEndDate()` returns the right value. `->end` must reflect whatever `setEndDate()` set, including when the end date is removed again, and the same staleness has to be addressed for the period's start when `setStartDate()` is used. Behavior on PHP versions below 8.2 must stay exactly as it is today.
