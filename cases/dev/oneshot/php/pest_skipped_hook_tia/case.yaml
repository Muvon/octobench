system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  TIA says it is enabled but silently falls back to the results-only tier when
  the final test is skipped from a `beforeEach` hook. PHPUnit records the skip
  result without emitting the normal prepared/finished lifecycle pair, so the
  collector leaves that test marked unfinished and refuses to write the
  complete-run graph.

  A test that already has a recorded result, including a hook-level skip, must
  count as finished. A genuinely interrupted test with no result must still be
  detected as unfinished. Make this work in sequential and parallel TIA runs
  without changing normal pass, fail, or skip reporting.
