  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Make `TextDescriptor` wrap option, argument, help, and command-list
  descriptions to the interactive terminal width instead of relying on hard
  terminal wrapping.

  Keep the name and description inline when at least 20 columns remain for the
  description, aligning continuation lines to its starting column. On narrower
  terminals, put the description on following lines with six spaces of indent.
  Include rendered defaults in the wrapping calculation. Measure visible
  display width rather than bytes, so multibyte text and formatter tags do not
  shift or split wrapping.

  Automatic wrapping applies only to terminal output. Piped or buffered output
  remains unbounded for compatibility. Add a `terminal_width` describe option
  that explicitly selects a width and therefore enables deterministic wrapping
  on any output stream. Existing output should remain byte-for-byte unchanged
  when it fits or wrapping is not enabled.
