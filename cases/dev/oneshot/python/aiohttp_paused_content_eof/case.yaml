instruction: |
  Since aiohttp 3.14, slowly consuming a large `Content-Length` response can
  fail when the server sends the entire body and then closes while flow control
  has the HTTP parser paused. `feed_eof()` raises `ContentLengthError` even
  though its own message says the received and expected byte counts are equal.

  Fix EOF handling so a fully received fixed-length body pending parser
  completion drains and completes successfully. This must work in both the
  accelerated and pure-Python parser paths, including compressed bodies whose
  pending output must still be drained incrementally rather than expanded all
  at once. A genuinely truncated fixed-length body must continue to raise
  `ContentLengthError` with the correct received and expected counts.
