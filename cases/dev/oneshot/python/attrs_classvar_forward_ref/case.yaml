instruction: |
  A class of ours started behaving differently after we moved to a newer Python, and I have
  narrowed it down to how attrs decides whether an annotation is a class variable.

  If the annotation reaches attrs as a forward reference — an unevaluated string-like annotation
  object rather than the real `typing.ClassVar[...]` object, which is what you get when the name
  is not imported at all, or when annotations are not eagerly evaluated — attrs no longer
  recognises it as a class variable. The field is collected as a normal attribute, so it shows up
  in `fields_dict()`, becomes an `__init__` parameter, and the class no longer matches what the
  annotation says.

  With the same annotation written so that it evaluates to the real object, or quoted as a plain
  string, it is correctly skipped. So the detection only misses the forward-reference form.

  Please make class-variable detection recognise the forward-reference form as well, so that:

  - an annotation that names `ClassVar` through a forward reference is treated as a class variable
    and excluded from the generated fields and `__init__`;
  - the qualified, aliased and quoted spellings that already work keep working;
  - annotations that merely mention the name as part of some other type are not misclassified;
  - this behaves the same with and without `slots`.
