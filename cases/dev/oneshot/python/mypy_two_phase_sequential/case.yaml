system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  Current behavior

  Sequential checking can disagree with parallel checking about inferred
  types. For example, a function can see a global as only None even though
  a later module-level assignment establishes its non-None type. Cached
  results can also hide diagnostics when switching checking modes, and
  parallel checking of code passed with -c can miss function-body errors.

  Expected behavior

  Unless local partial types are disabled, sequential and parallel checking
  should have identical semantics for inferred types and diagnostics.
  Function bodies must see the completed inferred type of module globals,
  including assignments later in the module, while module-level expressions
  remain flow-sensitive.
  Respect strict-optional and no-strict-optional semantics.

  Preserve inference for globals and class attributes initially set to
  None and subsequently assigned in functions, instance methods, or class
  methods. Typed assignments retain their inferred type together with None;
  assignments in unchecked bodies retain the existing Any behavior. Local
  variables must not change a same-named global. Underconstrained partial
  types must produce the existing annotation diagnostics, and invalid uses
  must produce ordinary type errors rather than crashes.

  Sequential checking must still honor --no-local-partial-types and the
  per-file no-local-partial-types directive. Preserve legacy inference of
  empty containers from function bodies and generic lambda callbacks,
  including incremental rechecking after source edits.

  Switching from sequential to parallel checking must not reuse cached
  results that hide incompatible per-file options. In parallel mode, a
  per-file opt-out must report
  "--local-partial-types must be enabled in parallel mode" at line 1 and
  still check the module with local partial types enabled, reporting the
  usual missing-annotation diagnostics and unresolved item types.

  Parallel -c checking must report errors inside typed function bodies,
  using the existing diagnostic text, source locations, and exit-status
  conventions.
