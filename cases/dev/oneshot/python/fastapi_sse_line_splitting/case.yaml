system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  FastAPI's raw SSE response mangles some event data. A payload ending in `\n` loses the final empty `data:` line, while characters such as a vertical tab or Unicode line separator are incorrectly treated as SSE line breaks. Please make SSE use only `\n`, `\r\n`, and `\r` as separators, preserving trailing empty lines for both data and comments.
