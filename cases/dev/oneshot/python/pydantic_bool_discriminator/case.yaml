instruction: |
  Boolean discriminators produce invalid OpenAPI mapping keys. For a
  discriminated union using `Literal[True]` and `Literal[False]`, generated
  JSON Schema currently emits Python spellings (`"True"` and `"False"`) even
  though payloads and JSON Schema use lowercase JSON booleans.

  Make discriminator mapping keys use their serialized JSON representation,
  so boolean variants map under `"true"` and `"false"`. Preserve the existing
  behavior for string, integer, enum, and other discriminator values.
