instruction: |
  **Goal.** As a developer who gets some packages from a private index that is declared as an explicitly-selected source, I need `poetry show --outdated` to tell me when those packages have newer versions, in both the table output and the JSON output.

  Today a package pinned to a source whose priority is `explicit` is silently skipped by the outdated check, so it never appears as outdated even when the private index clearly has a newer release.

  **Acceptance criteria**

  - **Given** a project with an explicitly-selected source, a dependency pinned to that source, an older version installed and locked, and a newer version available only on that source, **when** I run the outdated check, **then** the package is listed with its current version, the newer version, and its description.
  - **Given** the same situation, **when** I ask for JSON output, **then** the entry reports the same current version, latest version, description and installed status.
  - **Given** the same package is declared more than once — different environment markers pointing at different explicitly-selected sources — **then** the latest version reported must come from the source recorded in the lock file for the environment actually in use, not from whichever declaration happens to come first.
  - **Given** packages that come from the default repository, or that are pinned to a direct URL or VCS origin, **then** the outdated check behaves exactly as it does today.
