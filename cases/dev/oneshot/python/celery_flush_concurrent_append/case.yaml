instruction: |
  We're losing monitoring events under load. `EventDispatcher.flush()` publishes a copied group batch, but if another thread appends while the socket write is happening, the successful flush clears those new events too. A successful flush should remove only the items it actually published; anything appended during publish must remain buffered. If publishing raises, both the original batch and concurrently appended events must remain for retry.
