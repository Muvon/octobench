  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  SQL aggregates can treat a constant or scalar subquery as one value per
  group instead of one value per input row. This produces incorrect empty-input
  results, counts, sums and string aggregation. Grouped expressions also have
  inconsistent bounds, scalar-shape and covariance behavior.

  P1. Aggregate value arguments must follow per-row SQL semantics for constants,
  expressions and scalar subqueries, including correlated subqueries, grouped
  and ungrouped queries, empty inputs, NULL, DISTINCT and FILTER. Scalar
  parameters such as STRING_AGG's separator and QUANTILE_CONT's quantile remain
  single values, unaffected by filtering the input rows. Preserve agreement
  between in-memory and streaming execution, and between inferred and collected
  schemas, including column names and result order where ORDER BY is specified.

  P2. Preserve aggregate result types: integer-literal SUM uses Int64, including
  signed values and FILTER; TOTAL produces floating-point results. Summing
  SMALLINT constants produces Int64, SUM(DISTINCT TRUE) uses the index-count
  type, and REAL sums remain Float32. Standard deviation or variance of repeated
  non-finite constants produces NaN. Unsupported string sums raise
  InvalidOperationError containing "`sum` operation not supported".

  P3. FILTER predicates referencing columns must be Boolean; otherwise raise
  InvalidOperationError containing "must be of type `Boolean`". Constant TRUE,
  FALSE and NULL predicates must count the appropriate rows.

  P4. HAVING may reference group keys, key aliases and aggregates together.
  Without GROUP BY, reject selected columns outside aggregates after applying
  wildcard EXCLUDE and REPLACE. Raise SQLSyntaxError identifying the column with
  the fragment "'<column>' should participate in the GROUP BY". Excluding every
  input column while selecting an aggregate remains valid.

  P5. Grouped gather with null_on_oob=True must return null for invalid positive
  or negative indices, including integers outside the index type or Int64
  range; valid indices retain their values and order. Without that option,
  invalid indices raise OutOfBoundsError. Preserve the same bounds behavior
  outside groups.

  P6. Sample covariance of a singleton is null; population covariance is zero,
  with ordinary multirow covariance unchanged. Empty grouped aggregation of
  repeated integer literals retains its Int32 output type. Scalar conditional
  expressions built from shared scalar aggregates remain one row on empty and
  nonempty input; when the condition is false and there is no otherwise value,
  return a null of the result type, including the index-count type for counts.
