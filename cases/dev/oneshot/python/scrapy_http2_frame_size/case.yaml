instruction: |
  Add a `HTTP2_MAX_FRAME_SIZE` setting for Scrapy's Twisted HTTP/2 download
  handler. It controls the maximum HTTP/2 frame size advertised by the client,
  in bytes, and defaults to the RFC default of `16384`. Values use the HTTP/2
  allowed range, `16384` through `16777215`.

  Apply the configured value when each HTTP/2 connection is initiated, before
  its initial settings are sent. Keep the default behavior unchanged, and
  document the setting, including that the httpx handler cannot honor it and
  that larger frames affect the granularity of download-size checks.
