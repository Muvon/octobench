  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  On the asyncio backend, if a cancel scope ends up containing a task that has already finished (reachable through improper cancel scope nesting — a task group entered but never properly exited, so its host task completes without unwinding), cancelling that scope pins the event loop at 100% CPU: the cancellation delivery keeps rescheduling itself forever because it never recognizes the finished task as done. Fix the spin: the skip belongs inside the delivery pass itself — delivery still runs and simply skips any already-finished task entirely (neither cancelling it nor counting it as a reason to retry), leaving no pending reschedule callback behind. Delivery to still-running tasks keeps working exactly as before. (Issue #1111.)
