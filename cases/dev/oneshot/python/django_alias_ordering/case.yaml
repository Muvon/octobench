instruction: |
  `QuerySet.totally_ordered` currently returns `False` whenever `order_by()`
  uses an annotation alias, even when that alias is a direct `F()` alias of a
  unique field or the primary key.

  Make total-order detection understand direct field aliases. Ordering by an
  alias of a unique field or primary key on the queryset's base model should
  count exactly as ordering by that field, including composite primary keys.
  An alias of a non-unique field must remain non-total, and traversing a
  relation must not be treated as a unique ordering of the base model even if
  the related field itself is unique.
