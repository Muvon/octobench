instruction: |
  Our CI runs pytest with `--no-summary` because the failure sections are very long and we read failures from the JUnit XML instead. After upgrading, the coverage report that our plugin prints at the end of the run disappeared from the console.

  We reproduced it without coverage: put this in a `conftest.py`

  ```python
  def pytest_terminal_summary(terminalreporter, exitstatus, config):
      terminalreporter.write_line("MY PLUGIN SUMMARY")
  ```

  and run any test file with `--no-summary`. The line is never printed. Without `--no-summary` it is printed. Dropping `--no-summary` is not an option for us — we do want pytest's own failure/error sections suppressed.

  `--no-summary` should only suppress pytest's own summary sections. Plugins that implement the terminal-summary hook must still run and still be able to write to the terminal.
