instruction: |
  When building URLs with the float converter, very small or very large float values get rendered in scientific notation — e.g. 0.00001 becomes 1e-05 in the path, which doesn't match the float converter's pattern and produces broken URLs. The float converter should always emit plain decimal notation, without unnecessary trailing zeroes, so that built URLs keep round-tripping: they match the route and parse back to the same float value.
