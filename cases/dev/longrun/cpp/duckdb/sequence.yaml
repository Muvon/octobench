  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
meta:
  repo: https://github.com/duckdb/duckdb
  target_branch: main
  base_sha: e5d6787a684fd90084704edbc412049760304a8f
  prs: [24258, 24228, 24526, 24683, 24700, 24015, 24600, 24760, 24788, 24784, 24669, 24786, 24660, 24901, 24846]
  continuity_theme: query planning, join reconstruction, filter pushdown, and semantics-preserving optimizer rewrites
  provenance_note: >-
    Fifteen chronological production-and-test changes merged to DuckDB main by
    non-bot contributors and maintainers. PR bodies, reviews, commits, author
    metadata, and trailers showed no declared AI use or AI co-author marker.
    Divergent release-branch work, source-only patches, a change from a newly
