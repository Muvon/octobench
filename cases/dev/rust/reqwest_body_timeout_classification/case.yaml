instruction: |
  We stream large responses and set a read timeout on the client. When the server stalls halfway through the body, our request does fail — but the error we get back says `error decoding response body`, and `is_timeout()` on it returns `false`. Because our retry layer keys off `is_timeout()`, these failures are never retried and get logged as data corruption instead.

  The underlying cause really is the timeout: if we shorten the timeout, the same error appears sooner; if we remove it, the request completes.

  We would like `is_timeout()` to return `true` for a timeout that fires while the response body is being read, no matter how deep it is wrapped. It is fine and arguably correct that this is still classified as a decode error — the failure did happen while decoding the body — so please keep `is_decode()` returning `true` for it. A genuine decode failure with no timeout involved must of course still not be reported as a timeout.
