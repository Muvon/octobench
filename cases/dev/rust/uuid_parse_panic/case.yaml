id: dev_rust_uuid_parse_panic
name: UUID parser panic on malformed input
category: dev
difficulty: medium
meta:
  repo: https://github.com/uuid-rs/uuid
  pr: 886
  scenario: crash-fix
  base_sha: d11965705f88ae2546e0d277dac8f52f47e5694f
