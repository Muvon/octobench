instruction: |
  Reversing the day and week iterators on NaiveDate gives wrong results. Doing `some_date.iter_days().take(4).rev()`, expecting the last four dates of the forward run in reverse, instead yields dates BEFORE the start date — the iterator walks backwards from the start rather than reversing the bounded window. Same problem for `iter_weeks()`. Requirements:
  - For any start date and any n, `.iter_days().take(n).rev()` and `.iter_weeks().take(n).rev()` must yield exactly the forward sequence reversed.
  - Reverse iteration must respect the same upper bound as forward iteration: a range that forward-iterates only k elements before hitting NaiveDate::MAX must also yield only k when reversed — never dates below the start.
  - size_hint/len must stay consistent with what remains in the range when consumed from either end.
  - Forward iteration and its termination at NaiveDate::MAX are unchanged. Update the iterator doc examples to demonstrate the corrected double-ended behavior.
