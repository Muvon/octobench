instruction: |
  When the cookie jar extracts cookies from an HTTP response it should honor the `__Secure-` and `__Host-` name prefixes from the cookie spec; today a server (or attacker-controlled response) can set `__Secure-SID` without `Secure`, or `__Host-SID` with a `Domain` or non-root `Path`, and the jar stores it. Requirements:
  - A response cookie whose name starts with `__Secure-` (prefix matched case-insensitively) must carry the Secure attribute, else it is ignored.
  - A response cookie whose name starts with `__Host-` must be Secure, host-only (no Domain), scoped to path `/`, and the original Set-Cookie header must actually contain a `Path=` attribute (a bare `Path` token without `=` does not count — note the jar defaults a missing Path, so the parsed cookie alone cannot tell you this).
  - Prefix matching is case-insensitive but cookie names stay case-sensitive: the stored name keeps its original casing, and differently-cased names remain distinct cookies.
  - Rejected prefixed cookies are ignored ENTIRELY — in particular an invalid prefixed cookie with Max-Age=0 must not delete an existing valid cookie of the same name.
  - Only response extraction validates prefixes; cookies added directly to the jar or restored from persistence are unchanged. Names merely containing the prefix substring mid-name are not prefixed.
