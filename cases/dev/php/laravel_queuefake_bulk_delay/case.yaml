instruction: |
  **Goal.** As an application developer writing tests, I need the fake queue to honour job delays during bulk dispatch the same way a real queue connection does, so that a test suite that passes against the fake reflects what production will do.

  Today, bulk-pushing onto the faked queue pushes every job for immediate processing, ignoring both the delay attribute on a job class and a delay set at runtime on the job instance. Real connections respect both.

  **Acceptance criteria**

  - **Given** a faked queue, **when** I bulk-push a job class that declares a delay attribute together with a job that declares none, onto a named connection queue, **then** exactly one of them is recorded as delayed on that queue and the other is recorded as pushed immediately.
  - **Given** a faked queue, **when** I bulk-push a job instance on which I set a delay at runtime, **then** it is recorded as delayed on the target queue.
  - **Given** either of the above, **then** the queue name and the payload data passed to the bulk call must reach the recorded job unchanged, and the existing assertions for "was this job pushed", "was it pushed on this queue" and push counts must keep working for delayed jobs too.
  - **Given** a bulk push of jobs that declare no delay at all, **then** behaviour is identical to today — nothing becomes delayed.
