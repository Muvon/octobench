instruction: |
  Catch2's console output line-wrapping breaks non-ASCII text: multi-byte UTF-8 characters (accented letters, CJK, emoji) get split mid-character and line breaks land at the wrong column, because the text-flow component counts bytes instead of characters (see issue #1022). Fix it so UTF-8 text wraps correctly:
  - The wrapping string type's size must count UTF-8 codepoints (a 2-, 3-, or 4-byte sequence counts as one), still excluding ANSI escape sequences from the count.
  - Both forward and backward iteration must step one codepoint at a time (never landing inside a multi-byte sequence), and substring extraction must keep each codepoint's full byte sequence intact.
  - Column wrapping is by codepoints: width N accommodates N visible characters, and a multi-byte character is never split across lines.
  - ANSI escape skipping and pure-ASCII behavior are unchanged.
