system_prompt: |
  You are an autonomous software engineer working in an existing repository at the current directory.
  Resolve the requested task completely, as the project's maintainers would. When done, stop.
instruction: |
  The no-unreachable-loop rule crashes when the ignore option lists every loop type. With `no-unreachable-loop: ["error", { ignore: ["WhileStatement", "DoWhileStatement", "ForStatement", "ForInStatement", "ForOfStatement"] }]`, linting any code containing a loop (for example `while (a) break;`) throws `Cannot read properties of undefined (reading 'type')` instead of simply reporting nothing. When every loop type is ignored the rule has nothing to check, so it must not crash and must not report anything; configurations ignoring only some loop types must keep behaving exactly as they do today.
