# 3-arm bench: codex (default) vs octomind octohub:{glm,minimax}. kimi-code dropped (hangs via octohub).
runs:
  - provider: codex
    model: gpt-5.5
    provider_model: gpt-5.5
  - provider: octomind
    model: glm-5.1
    provider_model: octohub:glm
  - provider: octomind
    model: minimax-m3
    provider_model: octohub:minimax
