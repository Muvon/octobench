# Octomind Configuration File
# This file contains all configurable settings for Octomind.
# All values shown here are the defaults - you can customize any of them.
#
# 💡 Tips:
#   • View current config: octomind config --show
#   • Validate config: octomind config --validate

# Configuration version (DO NOT MODIFY - used for automatic upgrades)
version = 12

# ═══════════════════════════════════════════════════════════════════════════════
# SYSTEM-WIDE SETTINGS
# These settings apply globally across all roles and commands
# ═══════════════════════════════════════════════════════════════════════════════

# Log level for system messages (none, info, debug)
# • none: No logging output (cleanest experience)
# • info: Show important operations and status messages
# • debug: Show detailed debugging information
log_level = "info"

# Default tag used when no TAG is passed to `octomind run` (and acp/server).
# Can be a role name (e.g. "developer") or a tap agent (e.g. "octomind:assistant").
# The built-in tap muvon/octomind-tap ships ready-to-use agents like octomind:assistant.
default = "assistant:concierge"

# NOTE (v12): custom_instructions_file_name / custom_constraints_file_name are
# gone from octomind — it now auto-loads a hardcoded AGENTS.md from the workdir.
# The bench never shipped INSTRUCTIONS.md/CONSTRAINTS.md into cases, so nothing
# is lost; AGENTS.md pickup is normal client behaviour every client shares.

# Sandbox mode: restrict all filesystem writes to the current working directory
# When enabled, the process and all child processes (shell, MCP servers) cannot
# write outside the directory where octomind was launched.
# Supported on Linux (Landlock, kernel 5.13+) and macOS (Seatbelt).
# Can also be enabled at runtime with --sandbox CLI flag.
sandbox = false

# octobench: the container is egress-sealed; telemetry posts would only add
# blocked-connection noise and retries. Keep off.
telemetry = false

# ═══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE & LIMITS
# Configure thresholds and performance-related settings
# ═══════════════════════════════════════════════════════════════════════════════

# Global token limit for ALL MCP tool responses (0 = unlimited)
# When exceeded, responses are automatically truncated with notice
mcp_response_tokens_threshold = 20000

# Maximum tokens per session before truncation kicks in (0 = disabled, >0 = enabled)
max_session_tokens_threshold = 200000

# Keep the prompt cache warm with periodic pings while the session idles.
# When you walk away after the AI replies, Octomind sends a minimal request
# (max_tokens = 1) just before the cache TTL would expire, so the next turn
# still hits the cache. Each ping costs cache-read tokens, so this is opt-in.
#
# Provider-aware: only providers whose API supports refresh-on-read are
# pinged. Today that's Anthropic (1h TTL, always long cache).
# Other providers (OpenAI implicit cache, Gemini, DeepSeek) are skipped — no
# wasted requests.
cache_keepalive_enabled = false

# Stop pinging this many seconds after the last user activity. Default 1800
# (30 min). Past this point the cache is left to expire so an abandoned
# session does not keep billing forever. Set to 0 to ping until the session
# ends (only sensible in daemon mode under explicit cost monitoring).
cache_keepalive_max_idle_seconds = 1800

# ═══════════════════════════════════════════════════════════════════════════════
# USER INTERFACE
# Configure how Octomind displays information
# ═══════════════════════════════════════════════════════════════════════════════

# Enable markdown rendering for AI responses (makes output prettier)
enable_markdown_rendering = true

# Markdown theme for styling (default, dark, light, ocean, solarized, monokai)
# Use 'octomind config --list-themes' to see all available themes
markdown_theme = "default"

# Session spending threshold in USD (0.0 = no limit)
# When exceeded, Octomind will prompt before continuing
max_session_spending_threshold = 0.0

# Request spending threshold in USD (0.0 = no limit)
# When exceeded during a single request processing, Octomind will stop execution
# This tracks cost from user input until next user input or session end
max_request_spending_threshold = 0.0

# ═══════════════════════════════════════════════════════════════════════
# CAPABILITY AUTO-ACTIVATION
# Enable/disable automatic capability activation on each user message.
# When enabled, capabilities whose triggers semantically match the user's
# intent are activated automatically (no LLM routing turn needed).
# Disable to require manual `capability(action="enable")` calls only.
# ═══════════════════════════════════════════════════════════════════════
auto_capabilities = false

# Required field (strict parse). The bench defines no /prompt templates.
# Must stay ABOVE the first table header ([model]) or it parses as model.prompts.
prompts = []

# Complete baseline model profile (v12: replaces the old top-level model /
# max_tokens / reasoning_effort / retry scalars). Every role, tap, workflow
# step, dynamic agent, and internal model profile inherits fields it does not
# override. THE bench main model lives here — keep as is.
[model]
name = "zai:glm-5.3"
# Reasoning effort hint for thinking-capable models.
# Valid values: "low", "medium", "high", "xhigh", "max".
reasoning_effort = "medium"
max_tokens = 32000
temperature = 0.3
top_p = 0.7
top_k = 20
max_retries = 1
retry_timeout = 10
# Hard timeout for one provider request. 0 = no timeout.
request_timeout_seconds = 300

[capabilities]
# octobench: route websearch to Brave (real npm pkg) — the default `tavily`
# provider points at @tavily/mcp-server which is not published (npm 404 noise).
websearch = "brave"

# Tap model overrides for specific agents
# Each key is a tap agent tag and each value is only a model name (v12: nested
# profiles are no longer accepted here). The selected model keeps the main
# [model] parameters unless the resolved role independently overrides them.
# Priority: runtime override > role model > tap model > main model name
# Example:
# [taps]
# "developer:general" = "ollama:glm-5"
# "octomind:assistant" = "openai:gpt-4o"
# Leave empty to use default model for all tap agents
[taps]

# ═══════════════════════════════════════════════════════════════════════════════
# API KEYS AND AUTHENTICATION
# All API keys are read from environment variables for security
# Set these environment variables before running Octomind:
#   • OPENROUTER_API_KEY - for OpenRouter (https://openrouter.ai/)
#   • OPENAI_API_KEY - for OpenAI (https://platform.openai.com/)
#   • ANTHROPIC_API_KEY - for Anthropic (https://console.anthropic.com/)
#   • DEEPSEEK_API_KEY - for DeepSeek (https://platform.deepseek.com/)
#   • GOOGLE_APPLICATION_CREDENTIALS - path to Google Cloud credentials JSON
#   • AWS_ACCESS_KEY_ID - for Amazon Bedrock
#   • CLOUDFLARE_API_TOKEN - for Cloudflare Workers AI

# ═══════════════════════════════════════════════════════════════════════════════
# ROLE CONFIGURATIONS
# Define custom roles here to override or extend tap-provided agents.
# Roles defined here take precedence over tap manifests with the same name.
#
# The built-in tap (muvon/octomind-tap) already ships production-ready roles:
#   https://github.com/muvon/octomind-tap
#
# Roles inherit the complete [model] profile. Add [roles.model] only for fields
# that genuinely differ (v12: role-level temperature/top_p/top_k scalars moved
# into the nested [roles.model] table).
# ═══════════════════════════════════════════════════════════════════════════════

# octobench clean-bench role. Run with `octomind run developer`.
#
# Mirrors developer:general's shape (same sampling params, same working style)
# but carries the SHARED system prompt from configs/common/system_prompt.md —
# byte-identical to what claude/codex/opencode receive — so the bench measures
# client behaviour rather than prompt differences.
#
# Departures from developer:general:
#   - No websearch/knowledge. developer:general's system prompt MANDATES looking
#     up the upstream issue and mirroring the merged PR's diff; on a bench built
#     from merged PRs that is reading the answer key. This is the one thing every
#     client must lose, because it defeats the benchmark itself.
#   - No memory-*. Persistent cross-case memory would carry state between cases.
#
# KEPT: structural code search (octocode). It is octomind's own exploration
# capability and no other client ships an equivalent — that difference is part of
# what the bench compares, not noise to be normalised away. Equalising the
# PROMPT is what makes clients comparable; equalising their distinctive tooling
# would just measure the same agent four times.
[[roles]]
name = "developer"
system = """
<identity>
Elite senior developer. Pragmatic, precise, zero waste.
Optimize for correctness over agreeableness. Minimum code that solves the problem — nothing speculative.
A reported issue (bug report / feature request) always runs the full resolution protocol — however trivial it looks; half-fixes ship exactly when the ask "looked simple".
</identity>

<environment>
The repository is checked out at your working directory. It is a real project with its own conventions, build system and test suite.
You have filesystem and shell access to that checkout, and nothing else. There is no network: you cannot search the web, fetch URLs, or install anything that is not already present.
Everything needed to solve the task is in the repository. Never consult the upstream project, its issue tracker, or its pull requests.
</environment>

<scope>
- "Fix X" → fix only X, stop.
- "Add Y" → implement Y completely, touching existing code only where Y belongs in it, stop.
- "Investigate Z" → analyze, report, no changes.
- No "while I'm here…" — exact request only. Scope bounds WHAT you deliver, not how completely you deliver it.
</scope>

<workflow>
### Resolution protocol — MANDATORY when the task is a reported issue
Follow this sequence, in order; do not skip a step:
1. SURVEY — map every surface the change belongs to: the abstraction that owns the primitive, each of its implementations, and every wrapper/facade/sibling that proxies the same contract. Concretely: find types that hold a reference to (or inherit from) the one you are changing — each proxying layer must mirror a new public member; then search the new name repo-wide and reconcile every hit. Record the survey as your plan — one item per surface — and close an item only when that surface is implemented and checked; the plan is your completion contract.
2. IMPLEMENT — at the owning layer first, then mirror through every layer from step 1. Match the surrounding pattern: a class whose members delegate to an inner component gets a delegating member — create the inner primitive it needs, never inline what the pattern delegates. A new parameter that makes an existing name ambiguous (a second kind of key/id/name in one signature) renames both. Thin delegates forward arguments positionally, as received. Follow the repo's conventions for a change of this kind.
3. VERIFY — run the project's relevant tests; cover every layer you touched.
4. Only after 1-3: report done.

### Think before coding
- State assumptions explicitly. If uncertain → say so, don't guess.
- Debugging: reproduce → trace the failing path to the exact file:line where the defect lives → fix THAT. The fix belongs where the cause is, not where the error appears. If you cannot trace the root cause in the code, say so — don't hallucinate one.
- Unfamiliar territory → read the code that owns it before changing anything. Exact names come from what you read, never from memory.

### Root cause, not symptom
- Never work around what you can fix: no retry/sleep over a race, no broad try/catch over a failure, no special-case guard over a logic bug, no widened type or loosened assertion over a contract violation, no skipped/muted test or silenced warning over a red check. Each hides the problem and ships it.
- Pick the narrowest fix point the failing scenario actually passes through. Changing a widely-shared helper's contract (its error type, raise condition, or return shape) to solve one caller's problem is a blast-radius mistake: if the cause genuinely lives in the shared helper, check its other callers; otherwise guard at the reported path.
- Found a problem you can't fix in scope (pre-existing bug, flaky test, design flaw)? Report it plainly in the wrap-up — never silence, skip, or camouflage it.

### The ladder — climb before writing code
Stop at the first rung that holds:
1. Does this need to exist at all? Unrequested/speculative → skip it, say so in one line. (YAGNI)
2. Stdlib / language built-in does it? Use it.
3. Native platform or framework feature covers it? DB constraint over app code, framework primitive over a hand-roll.
4. Already-installed dependency solves it? Use it — never add a new dep for what a few lines do.
5. Can it be one line? One line.
6. Only then: the minimum code that works.
A reflex, not a research project — two rungs work, take the higher one and move on. Two options the same size → take the one correct on edge cases.

### Where laziness stops — the rails
Cut the ceremony, keep the boundary. Never simplify away: input validation at trust boundaries · error handling that prevents data loss · security/authorization · accessibility basics · anything explicitly requested.
Deliberate shortcut with a known ceiling (global lock, O(n²) scan, naive heuristic)? One comment names the ceiling and the upgrade path. Non-obvious shortcuts only.

### Parallel-first — testable, strict
THE TEST: if you can name the next ≥2 tool calls before running the first, they go in the SAME block.
- Tool calls are NOT thinking checkpoints. Think first, batch second.
- "I want to see X before deciding Y" is valid ONLY when Y's parameters genuinely depend on X's result. If you already know the file paths, the next read does NOT depend on the prior read.
- After a planning step that yields a list of files, the NEXT block MUST batch ALL of them, not N sequential reads.

### Goal-driven execution
- Before coding, transform the request into verifiable success criteria. "Add validation" → "tests cover invalid inputs and pass". "Fix bug" → "reproducing test now passes". "Refactor X" → "existing tests pass before and after".
- Weak criteria ("make it work") waste loops. State the check that proves each step done, before writing.
- After writing, run the check. If it fails → loop until it passes, or until you've identified why it can't — then surface it.

### Plan-first protocol
- Multi-step (>3 ops, multiple files, complex logic) → record a plan first. No user is present to confirm it, so the recorded plan is your contract: every item closed before you report done.
- Single-step (typo, import, rename, config value, 1–2 file edits) → execute directly.

### Surgical changes
- Touch only what the request requires. Match existing style even if you'd do it differently.
- Don't improve adjacent code, comments, or formatting. Don't change or remove comments and code you don't fully understand — orthogonal edits cause invisible regressions.
- The test: every changed line traces directly to the request. If a line doesn't, revert it.
- If your changes create orphans (unused imports/vars/functions) → remove them. Don't remove pre-existing dead code unless asked — mention it instead.

### Deep analysis — red flags
Async operations, callbacks, timers, event loops · mutable state in deferred/async contexts · concurrency, resource lifecycle, cross-component state sync.
Red flag detected → analyze: root cause → edge cases → timing → "what if this runs multiple times rapidly?"

### Verify what you changed
Before marking done:
- Every changed line traces directly to the request? ✓
- Orphaned imports/vars from your edits removed? ✓
- Success criteria actually met (not just code written)? ✓ — re-run the check, don't assert from intent.
- Every stated requirement from the original request implemented (re-read it)? ✓ — partial work reported as done is the worst failure.
</workflow>

<rules>
### Reading and searching
- Understand a file's layout before reading it whole; read the ranges you need rather than dumping large files.
- Search by symbol or pattern to locate code; read only what the search points at.
- Use the shell for what only the shell can do — running builds, tests and tooling — not as a replacement for reading files.

### Implementation principles
- KISS + DRY: simple, no over-engineering. Duplicate ≤2 times, refactor at 3+.
- YAGNI: no hypothetical futures, no unrequested features, no speculative abstractions.
- Deletion over addition: shortest working diff wins, fewest files.
- Senior-engineer overcomplication test: would an experienced engineer call this overcomplicated? Yes → simplify. If 200 lines could be 50, rewrite.
- No error handling for impossible scenarios. Validate at real boundaries (user input, external APIs) — not at internal seams you control.
- Clear > clever: optimize for human readability.
- Fail fast: validate early; fix the root cause, never suppress the error. No silent fallbacks or unrequested graceful degradation. Named constants, no magic numbers.
- Mocks, stubs, and placeholder data live in tests only. Never fabricate a response or leave a TODO where real logic was requested.
- Comments: why not what. No dead code. No commented-out code.
- Single responsibility. No wrapper methods (inline 1–3 line delegates).
- Name for clarity: specific beats generic. Avoid prefixes: unified/generic/common/internal.
- No backward compatibility unless explicitly requested.
- No defensive plumbing: no deprecated wrappers, init shims, or parallel "safe" variants when a clean path exists. Replace, don't layer.
- Prefer updating existing code over creating new files. Do not create summary documents, notes or scratch files.
</rules>

<interaction>
### Done output (after code changes)
Give a brief, scannable wrap-up — not prose, not a sales pitch:
- 1 line: what changed (the actual behavior, not "edited file X")
- 1 line: why (the cause/intent, only if non-obvious from the request)
- 1 line: the check that proves it — command + result ("cargo test: 42 passed"), not an assertion
- Bullets (≤4): files touched + one phrase per file describing the edit
- Optional: "⚠ Note:" line for follow-ups, caveats, or things skipped — only if real
Hard cap: ~6 lines total. No headers, no "Summary:", no closing offers.
Trivial edits (typo, rename, single-line tweak) → just "Done." or one-line description.
</interaction>
"""
welcome = ""

# Same sampling the role carried pre-v12 (mirrors developer:general).
[roles.model]
temperature = 0.1
top_p = 0.2
top_k = 10

# Tools spelled out per capability, exactly as the tap's capability files define
# them, so the role's surface is auditable against developer:general:
#   core                  → plan
#   shell                 → octofs:shell
#   filesystem-read       → octofs:view, octofs:workdir
#   filesystem-write      → octofs:text_editor, batch_edit, extract_lines
#   codesearch-structural → octocode:structural_search, view_signatures
# `runtime` is deliberately ABSENT: it grants MCP server management and
# capability activation, i.e. the agent could switch websearch back on.
# `orchestration` is referenced for ONE tool. `monitor` runs a long command and
# streams its output into the session inbox, which is how a build or test suite
# reports completion without being asked. Without it the only way to run
# something slow is `shell background:true`, which discards output and gives no
# completion signal — so the agent sleeps and tails a log, and each check is a
# full model round-trip that re-sends the whole conversation. Measured on the
# glm-5.3 campaign that pattern was 20-25% of all tool calls (62 of 250 on
# cpp/ada, 102 of 504 on cpp/cli11) while opencode, whose shell simply blocks,
# spent zero. The server's other tools stay out: `tap` delegates to registry
# specialists and would reach outside the seal, and `schedule` injects deferred
# messages. Neither is listed, so neither is reachable.
[roles.mcp]
server_refs = ["core", "octofs", "octocode", "orchestration"]
allowed_tools = [
  "core:*",
  "octofs:shell",
  "octofs:view",
  "octofs:workdir",
  "octofs:text_editor",
  "octofs:batch_edit",
  "octofs:extract_lines",
  "octocode:structural_search",
  "octocode:view_signatures",
  "orchestration:monitor",
]

# Example: override the developer role with your own system prompt
# (sampling inherits the main [model] profile: 0.3 / 0.7 / 20)
[[roles]]
name = "assistant"
system = """
You are helpful and knowledgeable assistant.
Working directory: {{CWD}}
"""
welcome = "Hello! Ready to code. Working in {{CWD}} (Role: {{ROLE}})"

[roles.mcp]
server_refs = ["core", "runtime", "filesystem", "agent"]
allowed_tools = ["core:*", "runtime:*", "filesystem:*", "agent:*"]

[[roles]]
name = "judge"
system = """
You are a strict benchmark judge for octobench.
Return ONLY valid JSON matching the requested schema.
No markdown, no prose outside the requested format, no extra keys.
{{SYSTEM}}
"""
welcome = ""

[roles.model]
temperature = 0.0
top_p = 1.0
top_k = 1
# A verdict is a small JSON object: measured over 318 real panel verdicts the
# largest was 1,605 chars (~401 tokens). Inheriting the global 32000 made every
# judge call reserve ~80x what it can use, and OpenRouter reserves against
# max_tokens, so the panel started returning 402 "requires more credits, or
# fewer max_tokens" long before the balance was actually spent. 8192 leaves
# 20x headroom, including for a panel model that emits reasoning.
max_tokens = 8192

[roles.mcp]
server_refs = []
allowed_tools = []

# ═══════════════════════════════════════════════════════════════════════════════
# MCP (MODEL CONTEXT PROTOCOL) SERVERS
# Configure external MCP servers and tools
# Built-in servers are defined here for transparency and easy customization
# ═══════════════════════════════════════════════════════════════════════════════

[mcp]
# Global tool restrictions (empty = no restrictions)
allowed_tools = []

# Per-operation timeout. For tool calls this is an idle deadline: each MCP
# progress notification resets it (octofs heartbeats long shell runs, so 30s
# here does not kill builds/tests).
# Built-in MCP servers (always available)
[[mcp.servers]]
name = "core"
type = "builtin"
timeout_seconds = 30
tools = []

[[mcp.servers]]
name = "runtime"
type = "builtin"
timeout_seconds = 30
tools = []

[[mcp.servers]]
name = "agent"
type = "builtin"
timeout_seconds = 30
tools = []

[[mcp.servers]]
name = "orchestration"
type = "builtin"
timeout_seconds = 30
tools = []

# octobench: static octocode server — overrides the tap capability launch args.
# --no-git skips git-based optimizations (root-owned /testbed trips ownership
# checks in containers); with octocode >= 0.18 mcp_index defaults to false so
# startup is inert and view_signatures / structural_search serve AST-side.
[[mcp.servers]]
name = "octocode"
type = "stdio"
command = "octocode"
args = ["mcp", "--path=.", "--no-git"]
timeout_seconds = 30
tools = []

# octobench: octofs serves the `shell` and `filesystem-*` capabilities the
# clean-bench `developer` role references. Tap agents get this server from the
# capability files; a config-local role must declare it itself.
[[mcp.servers]]
name = "octofs"
type = "stdio"
command = "octofs"
args = ["mcp"]
timeout_seconds = 30
tools = []

# ═══════════════════════════════════════════════════════════════════════
# SKILL AUTO-ACTIVATION & VALIDATION
# Configure automatic skill activation and output validation.
# Skills are tap-distributed instruction packs that inject domain knowledge.
# Auto-activation uses declarative `rules:` in SKILL.md frontmatter —
# no script spawning, evaluated in-process on each user message.
# Validators run deterministic checks on the final assistant message.
# ═══════════════════════════════════════════════════════════════════════

[skills]
# Enable automatic skill activation via declarative rules in SKILL.md frontmatter.
# When enabled, skills with `domains` matching the current agent's role
# are checked on each user message. Disable to use manual /skill only.
auto_activation = true

# Enable automatic validation via `validate` scripts at end of each assistant turn.
# When enabled, active skills with a `validate` script are run automatically.
# Disable to skip validators entirely (manual validation only).
auto_validation = false

# Reserved. Rules are evaluated in-process (no script timeout needed).
# Kept for config compatibility.
activation_timeout = 3

# Timeout in seconds for `validate` scripts. 0 = unlimited.
# Can be longer — validators like `cargo test` may need time.
validation_timeout = 60

# Maximum validation retries per skill before giving up.
# Prevents infinite loops when a validator consistently fails.
# Counter resets when validation passes or skill is deactivated.
max_retries = 3

# ═══════════════════════════════════════════════════════════════════════
# AUTOMATIC CONTEXT COMPRESSION
# ═══════════════════════════════════════════════════════════════════════

[compression]
# Maximum number of critical knowledge entries retained across compressions.
# Each compression may extract a short snippet of critical knowledge (decisions,
# constraints, user preferences). Only the last N entries are kept and injected
# into every subsequent compression so the AI never loses essential context.
knowledge_retention = 25

# Hard token budget for analysis findings retained across compression cycles.
# Findings are ranked for current-task relevance, recency, and diversity when
# they do not all fit. 0 disables analysis-finding retention.
analysis_findings_max_tokens = 6000

# Single compression trigger in absolute tokens (0 = compression disabled).
# How deep each compression goes is computed per cycle from the measured session
# growth rate and the context ceiling.
threshold = 70000

# NOTE: scalar compression keys must remain ABOVE the nested attention and
# model tables. A scalar placed after a nested table header is parsed as a
# field of that table and silently ignored — knowledge_retention sat there,
# inert, through every bench run before 2026-08-08.

# Evidence-grounded causal compaction (PACT): runtime-owned task/constraint
# pins, causal tool packets, an exact active frontier, attributed folds, and a
# stable lossless recall index.
# octobench: ENABLED — this is what the bench is measuring (ships default-off).
[compression.attention]
enabled = true
validator = true
telemetry = true

[compression.attention.governance]
enabled = true
verify_hash = true

# Decision model for compression decisions and summary generation
# (v12: renamed from [compression.decision]; `model = "..."` became `name`;
# partial override — omitted fields inherit the main [model] profile).
[compression.model]
# Keep this on a provider the bench authenticates: an unauthenticated model here
# makes octomind log "compression failed, continuing session" and skip
# compaction, so context overgrows past the model's window and the provider
# rejects with 400 "prompt too long".
name = "openrouter:qwen/qwen-3.8-flash"
max_tokens = 16000  # Enough for decision + summary
temperature = 0.3  # Lower temperature for consistent decisions
top_p = 1.0
top_k = 0
max_retries = 1
retry_timeout = 10

# ═══════════════════════════════════════════════════════════════════════
# SUPERVISOR - out-of-band control plane: learning, orientation, detectors, gate
# Extracts generalizable lessons from conversations and injects relevant
# ones into future sessions. Separate from memory — learning is narrower
# and structured: actionable facts scored by confidence.
# Storage: learning/{project}/{role}/ — project-scoped, role-filtered.
# ═══════════════════════════════════════════════════════════════════════

[supervisor]
# Master switch for the whole control plane
enabled = true

# ONE shared profile for gate, resolve, plan, condense, and learning (v12:
# the per-mechanic model knobs — gate.verifier_model, plan.model,
# condense.model, learning.model — are gone).
#
# Model choice carries the gate-verifier evidence, because the gate is the
# measured-sensitive seat: instrumented A/B replays (2026-08-12/23) showed
# openrouter:qwen/qwen-3.8-flash returning the full gate protocol 2/2 and
# flagging missed conditions, while minimax dropped mandated rules and the
# ollama-served deepseek emitted ZERO protocol lines (every verdict parsed
# Indeterminate; ollama cloud also ignores the schema parameter). The old
# deepseek-v4-flash seat only served plan/condense narrowing, which qwen
# handles. Transport must stay openrouter: it honours schema enforcement.
[supervisor.model]
name = "openrouter:qwen/qwen-3.8-flash"
# The gate's checklist + evidence protocol needs room (was gate max_tokens
# 24000 pre-v12). qwen flash is cheap; the OpenRouter max_tokens-reservation
# issue only bit the high-volume judge panel.
max_tokens = 24000
temperature = 0.0
top_p = 1.0
top_k = 0

[supervisor.learning]
# Enable the learning system (lessons + orientation memory, distill + recall)
# (v12: file backend is the only storage; the backend/model knobs are gone).
enabled = true

[supervisor.learning.evolution]
# Compile grounded memories into scoped skills and guardrail candidates.
# Keep off: cross-case skill synthesis would carry state between bench cases.
enabled = false

# Verify-gate: on self-reported `done`, run a checklist before accepting.
# The free deterministic pre-gate and goal recitation are always on; detector
# thresholds are fixed constants.
[supervisor.gate]
enabled = true

# Adaptive external plan manager.
[supervisor.plan]
enabled = true

# Condense: task-aware narrowing of oversized tool outputs. When a tool result
# exceeds tokens_threshold, ONE cheap-model call per round decides what the
# agent needs to see: all relevant -> kept in full; partly relevant -> only the
# needed lines (selected by LINE RANGES and reconstructed verbatim -- never
# rewritten); irrelevant -> replaced with a short note. v12: runs AFTER the
# blunt mcp_response_tokens_threshold prefix-cut, so it only narrows what the
# agent would actually have received.
[supervisor.condense]
enabled = true
# Learn a bounded per-session trigger from realized condenser savings.
# Off: a fixed threshold keeps runs comparable across cases.
adaptive = false
# Per-result trigger (estimated tokens). 0 = off. Keep well below
# mcp_response_tokens_threshold: that cap is the ceiling, this is the smart
# path under it.
tokens_threshold = 5000
