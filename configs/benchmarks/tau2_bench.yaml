engine: docker_task
name: tau2_bench
domain: agentic-orchestration-tooluse
fit: objective-verdict
contamination: low             # solo tickets scored on final env state, not text
description: >
  tau2-bench (Sierra) — telecom domain, SOLO mode: the agent is given a support
  ticket + policy and must resolve it by making tool calls against the tau2
  environment (no user simulator). Verdict = tau2's own reward (final DB/env-state
  assertions + required actions) via evaluate_simulation — fully objective and
  faithful to the upstream benchmark. The agent works the env through a shell
  bridge (`tau2 init_index|tools|call|reward`) baked into the image.
image: octobench-tau2:latest
workdir: /workspace
mount_workspace: true
success_regex: 'TAU2_REWARD=1(?:\.0+)?\b'
octomind_agent: developer:general   # needs shell to drive `tau2 call`; concierge/assistant lack it
system_prompt: >
  You are a telecom customer-service agent resolving a support ticket in a sandbox,
  WITHOUT talking to any user — you act only through tool calls.
prompt: >
  Resolve this telecom support ticket by calling environment tools. Steps:
  1) Run `cat ticket.md` (the request) and `cat policy.md` (the rules you MUST follow).
  2) Run `tau2 tools` to see the available tools and their JSON argument schemas.
  3) Make tool calls one at a time with:  tau2 call <tool_name> '<json args>'
     e.g.  tau2 call get_customer_by_phone '{"phone_number": "555-123-2002"}'
     Read each result before the next call; strictly follow policy.md.
  4) When the ticket's goal is achieved, stop — you are done. Do not fabricate tool
     output; only the real results from `tau2 call` count toward the score.
verify_cmds:
  - "tau2 reward"
notes: >
  Build the image once on the run box:
    docker build -f docker/Dockerfile.tau2 -t octobench-tau2:latest docker
  (needs octobench-agent:latest as the base). Run:
    python3 -m cli.bench --benchmark tau2_bench --executor docker --limit 1
  Instances are the 20 telecom SMALL-split solo tasks (indices 0-19); switch splits
  or add retail/airline by setting TAU2_DOMAIN / the loader in tau2_bridge.py. Full
  dual-control (with a user-simulator LLM) is intentionally out of scope here.
source: inline
instances:
  - { id: telecom-solo-00-mobile_data_issue, setup_cmds: ["tau2 init_index 0"] }
  - { id: telecom-solo-01-mobile_data_issue, setup_cmds: ["tau2 init_index 1"] }
