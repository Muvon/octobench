# Full comparison round: claude vs octomind (octohub) vs codex.
runs:
  - provider: claude
    model: claude-sonnet-4
    provider_model: claude-sonnet-4-6
  - provider: claude
    model: claude-opus-4
    provider_model: claude-opus-4-8
  - provider: octomind
    model: claude-sonnet-4
    provider_model: octohub:sonnet
  - provider: octomind
    model: claude-opus-4
    provider_model: octohub:opus
  - provider: octomind
    model: minimax-m3
    provider_model: octohub:minimax
  - provider: octomind
    model: kimi-k2.6
    provider_model: octohub:kimi
  - provider: octomind
    model: glm-5.1
    provider_model: octohub:glm
  - provider: codex
    model: gpt-5.5
    provider_model: gpt-5.5
