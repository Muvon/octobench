# Full bench: codex (default) vs octomind octohub:{glm,minimax,kimi-code}. octomind 0.34.1.
runs:
  - provider: codex
    model: gpt-5.5
    provider_model: gpt-5.5
  - provider: octomind
    model: glm-5.1
    provider_model: octohub:glm
  - provider: octomind
    model: minimax-m3
    provider_model: octohub:minimax
  - provider: octomind
    model: kimi-k2.6
    provider_model: octohub:kimi-code
